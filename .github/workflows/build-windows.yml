name: Build Windows

# 手动触发 + 首次推送本文件时自动跑一次
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 从 .fvmrc 读取 Flutter 版本，master / dev 分支都能正确编译
      - name: Read Flutter version from .fvmrc
        id: fvm
        shell: bash
        run: |
          ver=$(grep -o '"flutter"[[:space:]]*:[[:space:]]*"[^"]*"' simple_live_app/.fvmrc | grep -o '[0-9][0-9.]*')
          echo "version=$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # 只打印诊断信息。CI 上没有 Android SDK，doctor 必然非零退出，不能让它拖垮构建
      - name: Flutter doctor (诊断信息)
        continue-on-error: true
        run: flutter doctor -v

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      # 用 Flutter 原生构建，不依赖已停止维护的 flutter_distributor
      - name: Build Windows release
        working-directory: simple_live_app
        run: flutter build windows --release

      - name: Package zip
        shell: pwsh
        run: |
          $dir = Get-ChildItem -Path simple_live_app/build/windows -Directory -Recurse |
                 Where-Object { $_.FullName -match 'runner\\Release$' } |
                 Select-Object -First 1
          if (-not $dir) { throw "找不到 Release 输出目录" }
          Write-Host "打包目录: $($dir.FullName)"
          $zip = "simple-live-windows.zip"
          Compress-Archive -Path "$($dir.FullName)\*" -DestinationPath $zip -Force
          Write-Host "产物: $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-windows
          path: simple-live-windows.zip
          if-no-files-found: error
          retention-days: 30

      # 额外发一个 Release，免登录直接下载
      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-${{ github.run_number }}
          name: Windows build ${{ github.run_number }}
          body: |
            自动构建的 Windows 版本（zip，解压后双击 simple_live_app.exe 即可运行）。
            分支：${{ github.ref_name }}
            Flutter：${{ steps.fvm.outputs.version }}
          files: simple-live-windows.zip
          draft: false
